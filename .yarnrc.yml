# Pinned release, committed under .yarn/releases, so `yarn` resolves to 4.18.0
# even on a machine whose global yarn is still Classic 1.x. Corepack users get
# the same version from the "packageManager" field in package.json.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# node-modules linker rather than PnP: Next 16 with Turbopack, Tailwind's PostCSS
# plugin and next/font all resolve from a real node_modules tree, and PnP buys
# nothing here that would justify debugging those resolutions.
nodeLinker: node-modules

# Yarn quarantines npm versions younger than this many minutes (24h default).
# Left at the default on purpose — cheap protection against a compromised fresh
# publish. If an install fails with "quarantined", pin the previous version
# rather than lowering this.
npmMinimalAgeGate: 1440
